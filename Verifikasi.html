<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Akun Admin — TechFixAr</title>
<style>
  :root {
    --bg: #0a0d15;
    --panel: #0b0e17;
    --card: #10141f;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.1);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;

    --cyan: #22d3ee;
    --amber: #fbbf24;
    --green: #34d399;
    --rose: #fb7185;
    --violet: #a78bfa;
    --sky: #38bdf8;

    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex;
    min-height: 100vh;
    font-size: 13px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px 24px;
  }
  .logo svg { color: var(--cyan); }
  .logo span {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  .logo .accent { color: var(--cyan); }

  nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
  }
  nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 12.5px;
    line-height: 1.3;
    transition: background .15s, color .15s;
  }
  nav a:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  nav a.active { color: var(--cyan); font-weight: 500; }
  nav a svg { flex-shrink: 0; }

  .logout {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    color: var(--rose);
    text-decoration: none;
    font-size: 12.5px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  .logout:hover { color: #fca5a5; }

  /* ---------- Main ---------- */
  .main { flex: 1; padding: 24px 32px; }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
  }
  .page-subtitle {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0;
  }
  .pending-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.25);
    color: var(--amber);
    font-size: 11.5px;
    font-family: var(--font-mono);
    font-weight: 500;
    white-space: nowrap;
  }
  .pending-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
  }

  /* ---------- Stat cards ---------- */
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-sans);
    flex-shrink: 0;
  }
  .stat-icon.cyan { background: rgba(34,211,238,0.1); color: var(--cyan); }
  .stat-icon.green { background: rgba(52,211,153,0.1); color: var(--green); }
  .stat-icon.amber { background: rgba(251,191,36,0.1); color: var(--amber); }

  .stat-eyebrow {
    font-size: 10px;
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .stat-label { font-size: 13px; font-weight: 500; color: #e2e8f0; }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .tab:hover { color: var(--text-muted); border-color: var(--border-strong); }
  .tab.active {
    background: rgba(255,255,255,0.07);
    border-color: var(--border-strong);
    color: #fff;
  }

  .search-wrap { position: relative; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); pointer-events: none;
  }
  .search-box {
    width: 260px;
    padding: 7px 12px 7px 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { border-color: rgba(34,211,238,0.4); }

  /* ---------- Table ---------- */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-header, .table-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
    align-items: center;
    padding: 0 20px;
  }
  .table-header {
    padding-top: 12px;
    padding-bottom: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .table-row {
    padding-top: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  .table-row:last-child { border-bottom: none; }
  .table-row:hover { background: rgba(255,255,255,0.015); }

  .admin-cell { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }
  .avatar.amber { background: rgba(251,191,36,0.15); color: var(--amber); }
  .avatar.green { background: rgba(52,211,153,0.15); color: var(--green); }
  .avatar.violet { background: rgba(167,139,250,0.15); color: var(--violet); }
  .avatar.sky { background: rgba(56,189,248,0.15); color: var(--sky); }
  .avatar.rose { background: rgba(251,113,133,0.15); color: var(--rose); }

  .admin-name { font-size: 13px; font-weight: 500; color: #f1f5f9; line-height: 1.3; }
  .admin-email { font-size: 11px; font-family: var(--font-mono); color: var(--text-dim); line-height: 1.3; }

  .cell-role, .cell-date { font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    border: 1px solid transparent;
  }
  .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-badge.pending { background: rgba(251,191,36,0.1); color: var(--amber); border-color: rgba(251,191,36,0.2); }
  .status-badge.pending .dot { background: var(--amber); }
  .status-badge.active { background: rgba(52,211,153,0.1); color: var(--green); border-color: rgba(52,211,153,0.2); }
  .status-badge.active .dot { background: var(--green); }
  .status-badge.rejected { background: rgba(251,113,133,0.1); color: var(--rose); border-color: rgba(251,113,133,0.2); }
  .status-badge.rejected .dot { background: var(--rose); }

  .action-cell { display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    background: none;
    transition: background .15s;
  }
  .btn.approve { background: rgba(52,211,153,0.1); color: var(--green); border-color: rgba(52,211,153,0.25); }
  .btn.approve:hover { background: rgba(52,211,153,0.2); }
  .btn.reject { background: rgba(251,113,133,0.1); color: var(--rose); border-color: rgba(251,113,133,0.25); }
  .btn.reject:hover { background: rgba(251,113,133,0.2); }

  .status-note { font-size: 11.5px; font-family: var(--font-mono); }
  .status-note.active { color: rgba(52,211,153,0.7); }
  .status-note.rejected { color: rgba(251,113,133,0.7); }

  .empty-state {
    padding: 56px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 860px) {
    .table-header, .table-row { grid-template-columns: 1.6fr 1fr 1fr; }
    .cell-date { display: none; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div>
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span>TechFix<span class="accent">Ar</span></span>
    </div>
    <nav>
      <a href="#">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Kelola Panduan &amp; Troubleshooting
      </a>
      <a href="#" class="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        Verifikasi Akun Admin
      </a>
    </nav>
  </div>
  <button class="logout">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Keluar
  </button>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Verifikasi Akun Admin</h1>
      <p class="page-subtitle">Tinjau dan setujui pendaftaran admin baru sebelum akun aktif.</p>
    </div>
    <div class="pending-badge" id="pendingBadge">
      <span class="dot"></span>
      <span id="pendingBadgeText">2 Menunggu Persetujuan</span>
    </div>
  </div>

  <div class="stat-cards">
    <div class="stat-card">
      <div class="stat-icon cyan" id="statTotal">5</div>
      <div>
        <div class="stat-eyebrow">TOTAL</div>
        <div class="stat-label">Total Admin Terdaftar</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green" id="statActive">2</div>
      <div>
        <div class="stat-eyebrow">TOTAL</div>
        <div class="stat-label">Admin Aktif</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber" id="statPending">2</div>
      <div>
        <div class="stat-eyebrow">TOTAL</div>
        <div class="stat-label">Menunggu Verifikasi</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="Semua">Semua (<span id="cSemua">5</span>)</button>
      <button class="tab" data-filter="Pending">Pending (<span id="cPending">2</span>)</button>
      <button class="tab" data-filter="Aktif">Aktif (<span id="cAktif">2</span>)</button>
      <button class="tab" data-filter="Ditolak">Ditolak (<span id="cDitolak">1</span>)</button>
    </div>
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-box" id="searchInput" placeholder="Cari nama atau email...">
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span>Admin</span>
      <span>Role</span>
      <span>Status</span>
      <span>Terdaftar</span>
      <span>Aksi</span>
    </div>
    <div id="tableBody"></div>
  </div>
</main>

<script>
  const admins = [
    { id: 1, name: "Reza Firmansyah", email: "reza@rakitin.id", role: "Editor", status: "Pending", date: "31 Jul 2026", color: "amber" },
    { id: 2, name: "Siti Maharani", email: "siti@rakitin.id", role: "Moderator", status: "Pending", date: "30 Jul 2026", color: "green" },
    { id: 3, name: "Dimas Pratama", email: "dimas@rakitin.id", role: "Kontributor", status: "Aktif", date: "28 Jul 2026", color: "violet" },
    { id: 4, name: "Nadia Kusuma", email: "nadia@rakitin.id", role: "Editor", status: "Aktif", date: "25 Jul 2026", color: "sky" },
    { id: 5, name: "Fajar Nugroho", email: "fajar@rakitin.id", role: "Kontributor", status: "Ditolak", date: "22 Jul 2026", color: "violet" },
  ];

  let currentFilter = "Semua";
  let currentQuery = "";

  function initials(name) {
    return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  }

  function statusClass(status) {
    if (status === "Pending") return "pending";
    if (status === "Aktif") return "active";
    return "rejected";
  }

  function render() {
    const tableBody = document.getElementById("tableBody");
    const filtered = admins.filter(a => {
      const matchesTab = currentFilter === "Semua" || a.status === currentFilter;
      const q = currentQuery.trim().toLowerCase();
      const matchesQuery = q === "" || a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q);
      return matchesTab && matchesQuery;
    });

    if (filtered.length === 0) {
      tableBody.innerHTML = `<div class="empty-state">Tidak ada admin yang cocok dengan pencarian.</div>`;
    } else {
      tableBody.innerHTML = filtered.map(a => `
        <div class="table-row" data-id="${a.id}">
          <div class="admin-cell">
            <div class="avatar ${a.color}">${initials(a.name)}</div>
            <div>
              <div class="admin-name">${a.name}</div>
              <div class="admin-email">${a.email}</div>
            </div>
          </div>
          <div class="cell-role">${a.role}</div>
          <div>
            <span class="status-badge ${statusClass(a.status)}">
              <span class="dot"></span>${a.status}
            </span>
          </div>
          <div class="cell-date">${a.date}</div>
          <div class="action-cell">
            ${a.status === "Pending" ? `
              <button class="btn approve" data-action="approve" data-id="${a.id}">✓ Setujui</button>
              <button class="btn reject" data-action="reject" data-id="${a.id}">✕ Tolak</button>
            ` : a.status === "Aktif" ? `
              <span class="status-note active">✓ Sudah aktif</span>
            ` : `
              <span class="status-note rejected">✗ Ditolak</span>
            `}
          </div>
        </div>
      `).join("");
    }

    // Stat cards
    document.getElementById("statTotal").textContent = admins.length;
    document.getElementById("statActive").textContent = admins.filter(a => a.status === "Aktif").length;
    const pendingCount = admins.filter(a => a.status === "Pending").length;
    document.getElementById("statPending").textContent = pendingCount;

    // Tab counts
    document.getElementById("cSemua").textContent = admins.length;
    document.getElementById("cPending").textContent = pendingCount;
    document.getElementById("cAktif").textContent = admins.filter(a => a.status === "Aktif").length;
    document.getElementById("cDitolak").textContent = admins.filter(a => a.status === "Ditolak").length;

    // Pending badge
    const badge = document.getElementById("pendingBadge");
    if (pendingCount > 0) {
      badge.style.display = "flex";
      document.getElementById("pendingBadgeText").textContent = `${pendingCount} Menunggu Persetujuan`;
    } else {
      badge.style.display = "none";
    }

    attachRowEvents();
  }

  function attachRowEvents() {
    document.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = parseInt(btn.getAttribute("data-id"));
        const action = btn.getAttribute("data-action");
        const admin = admins.find(a => a.id === id);
        if (admin) admin.status = action === "approve" ? "Aktif" : "Ditolak";
        render();
      });
    });
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentFilter = tab.getAttribute("data-filter");
      render();
    });
  });

  document.getElementById("searchInput").addEventListener("input", (e) => {
    currentQuery = e.target.value;
    render();
  });

  render();
</script>
</body>
</html>
