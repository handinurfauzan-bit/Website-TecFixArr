<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Daftar akun admin TechFixAr. Pendaftaran memerlukan persetujuan Super Admin."
    />
    <title>Daftar Admin | TechFixAr</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <link rel="stylesheet" href="../assets/css/Registerasi_admin.css" />
  </head>
  <body>
    <main class="halaman-register-admin">
      <div class="register-grid-bg" aria-hidden="true"></div>
      <div class="register-glow" aria-hidden="true"></div>

      <section class="register-shell" aria-labelledby="register-heading">
        <header class="register-brand">
          <a
            class="register-brand__link"
            href="Landing.html"
            aria-label="TechFixAr, kembali ke beranda"
          >
            <span class="register-brand__mark" aria-hidden="true">
              <img class="admin-brand__logo" src="../assets/css/img/Logo.jpg" alt="TechFixAr Logo" />
            </span>
            <span class="register-brand__title">
              <span class="register-brand__title-text">TechFix</span
              ><span class="register-brand__title-accent">Ar</span>
            </span>
          </a>
          <p class="register-brand__subtitle">DAFTAR AKUN ADMIN</p>
        </header>

        <form class="register-form" action="login_admin.html" method="post">
          <div class="register-form__intro">
            <h1 class="register-form__title" id="register-heading">
              Buat Akun Admin Baru
            </h1>
            <p class="register-form__desc">
              Pendaftaran memerlukan persetujuan Super Admin sebelum aktif.
            </p>
          </div>

          <div class="register-field">
            <label class="register-field__label" for="nama">NAMA LENGKAP</label>
            <input
              class="register-field__input"
              id="nama"
              name="nama"
              type="text"
              placeholder="Budi Santoso"
              autocomplete="name"
              required
            />
          </div>

          <div class="register-field">
            <label class="register-field__label" for="email">EMAIL</label>
            <input
              class="register-field__input"
              id="email"
              name="email"
              type="email"
              placeholder="budi@rakitin.id"
              autocomplete="email"
              required
            />
          </div>

          <div class="register-field">
            <label class="register-field__label" for="password">PASSWORD</label>
            <div class="register-field__password">
              <input
                class="register-field__input"
                id="password"
                name="password"
                type="password"
                placeholder="Min. 8 karakter"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button
                class="register-field__toggle"
                type="button"
                aria-label="Tampilkan password"
                aria-controls="password"
                aria-pressed="false"
                data-toggle-password="password"
              >
                <svg
                  class="register-field__eye"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  aria-hidden="true"
                >
                  <path
                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="register-field">
            <label class="register-field__label" for="password-confirm"
              >KONFIRMASI PASSWORD</label
            >
            <input
              class="register-field__input"
              id="password-confirm"
              name="password_confirm"
              type="password"
              placeholder="Ulangi password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <button class="register-form__submit" type="submit">
            Kirim Pendaftaran
          </button>

          <p class="register-form__footer">
            Sudah punya akun?
            <a class="register-form__login" href="login_admin.html">Masuk</a>
          </p>
        </form>

        <footer class="register-back">
          <a class="register-back__link" href="Landing.html"
            >← Kembali ke Beranda</a
          >
        </footer>
      </section>
    </main>

    <script>
      (() => {
        const toggles = document.querySelectorAll("[data-toggle-password]");

        toggles.forEach((toggle) => {
          const inputId = toggle.getAttribute("data-toggle-password");
          const input = document.getElementById(inputId);
          if (!input) return;

          toggle.addEventListener("click", () => {
            const isVisible = input.type === "text";
            input.type = isVisible ? "password" : "text";
            toggle.setAttribute("aria-pressed", String(!isVisible));
            toggle.setAttribute(
              "aria-label",
              isVisible ? "Tampilkan password" : "Sembunyikan password",
            );
          });
        });
      })();
    </script>
  </body>
</html>
